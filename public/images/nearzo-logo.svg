<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="nzForest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A5948" />
      <stop offset="100%" stop-color="#1B3B2F" />
    </linearGradient>

    <linearGradient id="nzTerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#E27248" />
      <stop offset="100%" stop-color="#D9795B" />
    </linearGradient>

    <linearGradient id="nzSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3E9" />
      <stop offset="100%" stop-color="#DCE8DA" />
    </linearGradient>

    <filter id="nzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B3B2F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Radar Waves (Nearby Services Signal) -->
  <circle cx="50" cy="44" r="44" fill="none" stroke="#DCE8DA" stroke-width="2" stroke-dasharray="4, 4" opacity="0.8"/>
  <circle cx="50" cy="44" r="38" fill="#F4FAF4" opacity="0.6"/>

  <!-- Location Pin Body (Nearby Location) -->
  <path d="M 50 8 
           C 31 8, 16 23, 16 42 
           C 16 61, 42 86, 50 92 
           C 58 86, 84 61, 84 42 
           C 84 23, 69 8, 50 8 Z" 
        fill="url(#nzForest)" 
        filter="url(#nzGlow)"/>

  <!-- Inner Badge Shield -->
  <circle cx="50" cy="40" r="26" fill="#FAF8F3" stroke="#DCE8DA" stroke-width="1.5"/>

  <!-- Plumber Wrench Element (Left Side) -->
  <path d="M 39 26 
           C 34 29, 31 35, 33 41 
           C 34 44, 36 46, 39 48 
           L 32 60 
           L 37 63 
           L 44 51 
           C 46 51, 48 50, 49 49 
           L 44 44 
           L 41 45 
           C 38 43, 37 39, 39 36 
           C 40 34, 42 33, 44 33 
           L 43 27 
           C 41 26, 40 26, 39 26 Z" 
        fill="#2A5948" />

  <!-- Electricity Lightning Bolt (Right Side & Center Overlay) -->
  <path d="M 54 20 
           L 42 39 
           L 51 39 
           L 43 62 
           L 64 36 
           L 53 36 
           L 60 20 Z" 
        fill="url(#nzTerra)" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        stroke-linejoin="round"/>

  <!-- Water Droplet Accent (Plumbing Spark) -->
  <path d="M 36 34 
           C 36 32, 38 29, 38 29 
           C 38 29, 40 32, 40 34 
           C 40 36, 38 37, 36 37 
           C 34 37, 34 35, 36 34 Z" 
        fill="#D9795B"/>

  <!-- Live Pulse Dot at Base -->
  <circle cx="50" cy="40" r="2" fill="#FFFFFF"/>
</svg>
